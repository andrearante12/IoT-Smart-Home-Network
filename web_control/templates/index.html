<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Home Control</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --warm: #fbbf24;
            --cool: #60a5fa;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { font-weight: 300; letter-spacing: 4px; color: var(--accent); margin-bottom: 30px; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .all-lamps-card {
            grid-column: 1 / -1;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .button-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        h2 { margin: 0 0 15px 0; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; text-align: center; }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            text-transform: uppercase;
            min-width: 110px;
        }

        .btn-default { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-warm { background: var(--warm); color: #451a03; }
        .btn-cool { background: var(--cool); color: #1e3a8a; }
        .btn-on { background: var(--success); color: white; }
        .btn-off { background: var(--danger); color: white; }
        
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .control-group { margin: 20px 0; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.8rem; opacity: 0.6; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .group-title {
            grid-column: 1 / -1;
            margin: 20px 0 0 0;
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.8;
        }

        .status { font-size: 0.65rem; letter-spacing: 1px; margin-left: 8px; padding: 2px 8px; border-radius: 8px; vertical-align: middle; }
        .status.on { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status.off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .global-slider::-webkit-slider-thumb {
            border: 2px solid white;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

    <h1>LUMINA</h1>

    <div class="container">
        <h3 class="group-title">My Room</h3>
        <div class="card all-lamps-card">
            <h2>All My Room Lamps</h2>
            <div class="button-grid">
                <button class="btn-on" onclick="sendAll('state', 'ON')">On</button>
                <button class="btn-off" onclick="sendAll('state', 'OFF')">Off</button>
                <button class="btn-cool" onclick="applyToAll(254, 150)">Cool</button>
                <button class="btn-warm" onclick="applyToAll(254, 500)">Warm</button>
                <button class="btn-default" onclick="applyPreset(DEFAULT_PRESET)">Default</button>
            </div>

            <div class="control-group" style="max-width: 600px; margin: 0 auto;">
                <div class="label-row"><span>Group Brightness</span><span id="global-bri-val">100%</span></div>
                <input type="range" class="global-slider" id="global-bri" min="0" max="254" value="254" 
                    oninput="updateGlobalLabel(this.value)" 
                    onchange="syncAll('brightness', this.value)">
                
                <div class="label-row" style="margin-top:15px;"><span>Group Tone (Cool to Warm)</span></div>
                <input type="range" class="global-slider" id="global-temp" min="150" max="500" value="500" 
                    onchange="syncAll('color_temp', this.value)">
            </div>
        </div>

        <script>
            // Last known values for each lamp, kept in sync with the real lamps by the server
            const SAVED = {{ saved|tojson }};
            const GROUP_1 = [1, 2, 4, 5, 6];
            const GROUP_2 = [3];
            const NAMES = {4: 'Workbench Lamp', 5: 'Floor Lamp', 6: 'Reading Lamp'};
            // Per-lamp [brightness, color_temp] for the Default button
            const DEFAULT_PRESET = {1: [254, 454], 2: [254, 454], 4: [192, 416], 5: [254, 370], 6: [254, 370]};

            function lampCard(id) {
                return `
                    <div class="card">
                        <h2>${NAMES[id] || `Lamp ${id}`}<span class="status" id="status-${id}" hidden></span></h2>
                        <div style="display:flex; gap:10px; margin-bottom:20px;">
                            <button class="btn-on" style="flex:1" onclick="send(${id}, 'state', 'ON')">On</button>
                            <button class="btn-off" style="flex:1" onclick="send(${id}, 'state', 'OFF')">Off</button>
                        </div>
                        <div class="control-group">
                            <div class="label-row"><span>Brightness</span><span id="bri-val-${id}">100%</span></div>
                            <input type="range" id="bri-${id}" min="0" max="254" value="${SAVED[id].brightness}" 
                                oninput="updateLabel(${id}, this.value)" 
                                onchange="send(${id}, 'brightness', this.value, 1)">
                        </div>
                        <div class="control-group">
                            <div class="label-row"><span>Tone</span></div>
                            <input type="range" id="temp-${id}" min="150" max="500" value="${SAVED[id].color_temp}" 
                                onchange="send(${id}, 'color_temp', this.value, 1)">
                        </div>
                    </div>
                `;
            }

            GROUP_1.forEach(id => document.write(lampCard(id)));
            document.write(`<h3 class="group-title">Group 2 · Lamp 3</h3>`);
            GROUP_2.forEach(id => document.write(lampCard(id)));
        </script>
    </div>

    <script>
        // Updated send function to include transition
        function send(id, action, val, trans = 0) {
            fetch('/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    lamp_id: id, 
                    action: action, 
                    value: val,
                    transition: trans
                })
            });
        }

        function sendAll(action, val) {
            GROUP_1.forEach(id => send(id, action, val, 1));
        }

        // Global Sync logic with a smooth 2-second fade
        function syncAll(action, val) {
            const fadeTime = 0.5;
            GROUP_1.forEach(id => {
                send(id, action, val, fadeTime);
                if (action === 'brightness') {
                    document.getElementById(`bri-${id}`).value = val;
                    updateLabel(id, val);
                } else if (action === 'color_temp') {
                    document.getElementById(`temp-${id}`).value = val;
                }
            });
        }

        // Presets with a smooth 3-second fade
        function applyToAll(bri, temp) {
            applyPreset(Object.fromEntries(GROUP_1.map(id => [id, [bri, temp]])));
        }

        function applyPreset(preset) {
            const fadeTime = 3;
            GROUP_1.forEach(id => {
                const [bri, temp] = preset[id];
                send(id, 'state', 'ON');
                send(id, 'brightness', bri, fadeTime);
                send(id, 'color_temp', temp, fadeTime);
                
                document.getElementById(`bri-${id}`).value = bri;
                document.getElementById(`temp-${id}`).value = temp;
                updateLabel(id, bri);
            });
            // Group sliders show the average of their lamps
            const avg = i => Math.round(GROUP_1.reduce((sum, id) => sum + preset[id][i], 0) / GROUP_1.length);
            document.getElementById('global-bri').value = avg(0);
            document.getElementById('global-temp').value = avg(1);
            updateGlobalLabel(avg(0));
        }

        function updateLabel(id, val) {
            const percent = Math.round((val / 254) * 100);
            document.getElementById(`bri-val-${id}`).innerText = percent + '%';
        }

        function updateGlobalLabel(val) {
            const percent = Math.round((val / 254) * 100);
            document.getElementById(`global-bri-val`).innerText = percent + '%';
        }

        // Don't move a slider out from under someone who just touched it
        const HOLD_MS = 5000;
        const touched = {};
        ['pointerdown', 'input', 'change'].forEach(type => document.addEventListener(type, e => {
            if (e.target.type === 'range') touched[e.target.id] = Date.now();
        }));

        function setSlider(elId, val) {
            if (Date.now() - (touched[elId] || 0) < HOLD_MS) return false;
            document.getElementById(elId).value = val;
            return true;
        }

        function setStatus(id, state) {
            const el = document.getElementById(`status-${id}`);
            el.hidden = !state;
            if (!state) return;
            el.innerText = state;
            el.className = 'status ' + state.toLowerCase();
        }

        function applyState(state) {
            [...GROUP_1, ...GROUP_2].forEach(id => {
                const lamp = state[id];
                if (setSlider(`bri-${id}`, lamp.brightness)) updateLabel(id, lamp.brightness);
                setSlider(`temp-${id}`, lamp.color_temp);
                setStatus(id, lamp.state);
            });
            // Group sliders show the average of their lamps
            const avg = key => Math.round(GROUP_1.reduce((sum, id) => sum + Number(state[id][key]), 0) / GROUP_1.length);
            if (setSlider('global-bri', avg('brightness'))) updateGlobalLabel(avg('brightness'));
            setSlider('global-temp', avg('color_temp'));
        }

        async function refresh() {
            if (document.hidden) return;
            try {
                const res = await fetch('/state');
                if (res.ok) applyState(await res.json());
            } catch (e) {}
        }

        window.onload = () => {
            applyState(SAVED);
            setInterval(refresh, 2000);
        };
    </script>
</body>
</html>
